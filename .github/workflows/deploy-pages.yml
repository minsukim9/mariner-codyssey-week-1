name: Deploy Portfolio to GitHub Pages


on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Check GitHub API token
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          if [ -z "$GH_API_TOKEN" ]; then
            echo "GH_API_TOKEN secret is not configured."
            exit 1
          fi


      - name: Prepare deployment directory
        run: |
          mkdir -p dist
          mkdir -p dist/data

          cp index.html dist/
          cp -R css dist/
          cp -R js dist/
          cp -R images dist/


      - name: Fetch GitHub repositories
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/users/${GITHUB_REPOSITORY_OWNER}/repos?type=owner&sort=updated&direction=desc&per_page=100" \
          | jq '
              flatten
              | map({
                  name: .name,
                  description: .description,
                  language: .language,
                  stargazers_count: .stargazers_count,
                  html_url: .html_url
              })
            ' \
          > dist/data/repos.json


      - name: Show generated repository data
        run: |
          echo "Generated repository count:"
          jq "length" dist/data/repos.json


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build


    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4